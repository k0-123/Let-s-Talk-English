name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lte_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lte_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lte_test
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lte_e2e
      PAYLOAD_SECRET: ci-only-secret
      SERVER_URL: http://localhost:3100
      TZ: Asia/Kolkata
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create the end-to-end test database
        run: psql -h localhost -U postgres -c 'CREATE DATABASE lte_e2e'
        env:
          PGPASSWORD: postgres

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Integration and unit tests
        run: npm run test:int

      - name: Build
        run: npm run build

      # The app's web build joins the end-to-end tests (tests/e2e/mobile-app.e2e.spec.ts).
      - name: Install the app's dependencies
        run: npm ci
        working-directory: mobile

      - name: Build the app for the end-to-end tests
        run: npm run build:app-e2e

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (production build)
        run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: 1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  mobile:
    name: App (Expo) type-check, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and screen tests
        run: npm test -- --ci

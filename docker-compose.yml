# Local development database. Hosting is not decided yet, so this file only
# runs Postgres for developers who do not have it installed:
#
#   docker compose up -d      # start
#   docker compose down       # stop (data is kept in the "pgdata" volume)
#
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lte_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the extra databases used by the test suites.
      - ./docker/create-test-databases.sql:/docker-entrypoint-initdb.d/create-test-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
